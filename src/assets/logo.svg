<svg width="360" height="320" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Elliptical text paths -->
    <path
      id="topArc"
      d="M 25,126 A 170,140 0 0,1 335,126"
      fill="none"
    />

    <path
      id="bottomArc"
      d="M 25,194 A 170,140 0 0,0 335,194"
      fill="none"
    />
  </defs>

  <!-- Outer seal -->
  <ellipse
    cx="180"
    cy="160"
    rx="176"
    ry="156"
    fill="#fcf9f3"
    stroke="#c3c8c1"
    stroke-width="2"
  />

  <!-- Inner ring -->
  <ellipse
    cx="180"
    cy="160"
    rx="112"
    ry="98"
    fill="none"
    stroke="#c3c8c1"
    stroke-width="1"
  />

  <!-- Decorative separators -->
  <circle cx="18" cy="160" r="3.5" fill="#546251"/>
  <circle cx="342" cy="160" r="3.5" fill="#546251"/>

  <!-- Upper text -->
  <text
    class="logo-top-text"
    font-family="'Playfair Display', Georgia, serif"
    font-weight="700"
    fill="#475749"
    letter-spacing="0.15"
  >
    <textPath
      href="#topArc"
      startOffset="50%"
      text-anchor="middle"
    >
      THE NEW COVENANT CHURCH OF AFRICA
    </textPath>
  </text>

  <!-- Lower text -->
  <text
    class="logo-bottom-text"
    font-family="'Playfair Display', Georgia, serif"
    font-weight="700"
    fill="#475749"
    letter-spacing="2"
  >
    <textPath
      href="#bottomArc"
      startOffset="50%"
      text-anchor="middle"
    >
      ALPHA AND OMEGA
    </textPath>
  </text>

  <!-- Cathedral -->
  <g transform="translate(180,170) scale(1.12)">

    <!-- Ground -->
    <rect
      x="-58"
      y="52"
      width="116"
      height="4"
      rx="1"
      fill="#475749"
    />

    <!-- Left chapel -->
    <polygon
      points="-58,20 -44,-2 -30,20"
      fill="#546251"
    />

    <rect
      x="-52"
      y="20"
      width="16"
      height="32"
      fill="#5f6f60"
    />

    <rect
      x="-48"
      y="30"
      width="4"
      height="8"
      rx="2"
      fill="#d7e7d1"
    />

    <!-- Right chapel -->
    <polygon
      points="30,20 44,-2 58,20"
      fill="#546251"
    />

    <rect
      x="36"
      y="20"
      width="16"
      height="32"
      fill="#5f6f60"
    />

    <rect
      x="40"
      y="30"
      width="4"
      height="8"
      rx="2"
      fill="#d7e7d1"
    />

    <!-- Nave -->
    <rect
      x="-30"
      y="4"
      width="60"
      height="48"
      fill="#475749"
    />

    <!-- Tower -->
    <rect
      x="-16"
      y="-38"
      width="32"
      height="46"
      fill="#475749"
    />

    <!-- Spire -->
    <polygon
      points="-16,-38 0,-84 16,-38"
      fill="#546251"
    />

    <!-- Cross -->
    <rect
      x="-1.5"
      y="-100"
      width="3"
      height="16"
      fill="#475749"
    />

    <rect
      x="-6"
      y="-95"
      width="12"
      height="3"
      fill="#475749"
    />

    <!-- Tower window -->
    <path
      d="M -8,-14 a 8,8 0 0 1 16,0 v 14 h -16 z"
      fill="#d7e7d1"
    />

    <rect
      x="-1"
      y="-14"
      width="2"
      height="14"
      fill="#475749"
      opacity="0.45"
    />

    <!-- Main door -->
    <path
      d="M -8,52 v -18 a 8,8 0 0 1 16,0 v 18 z"
      fill="#fcf9f3"
    />

    <!-- Rose window -->
    <circle
      cx="0"
      cy="18"
      r="7"
      fill="#d7e7d1"
    />

    <circle
      cx="0"
      cy="18"
      r="2"
      fill="#475749"
    />

    <!-- Side windows -->
    <path
      d="M -24,26 a 4,4 0 0 1 8,0 v 10 h -8 z"
      fill="#d7e7d1"
    />

    <path
      d="M 16,26 a 4,4 0 0 1 8,0 v 10 h -8 z"
      fill="#d7e7d1"
    />

  </g>
</svg>
